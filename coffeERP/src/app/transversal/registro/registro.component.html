<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <span class="material-icons-outlined logo-icon">local_cafe</span>
      <h1>CoffeERP</h1>
      <p class="subtitle">Registrar usuario</p>
    </div>

    <form class="login-form" (ngSubmit)="registrar()">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" required />
      </div>
      @if (error()) { <span class="error-text">{{ error() }}</span> }
      @if (mensaje()) { <span>{{ mensaje() }}</span> }
      <button type="submit" class="btn-submit">Registrarme</button>
      <a routerLink="/login">Ya tengo una cuenta</a>
    </form>
  </div>
</div>
